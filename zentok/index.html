<style>
:root{--bg:#fff;--surf:#f5f7fb;--line:#e6eaf2;--ink:#0e1a33;--mute:#6b7894;--blue:#0b2a6f;--acc:#2456d6;--on:#fff;--desk:#eaeff7;--sh:0 1px 2px rgba(11,42,111,.06),0 6px 20px rgba(11,42,111,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--surf:#131a30;--line:#222c4a;--ink:#eef2fb;--mute:#93a0c0;--blue:#7ea2ff;--acc:#7ea2ff;--on:#0b1020;--desk:#060912;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--desk);color:var(--ink);font:14.5px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#shell{max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
header{padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px;border-bottom:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:flex-start;gap:9px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--blue);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:15px}
.logo{font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.4px;line-height:1}.logo small{display:block;font-size:8.5px;font-weight:600;color:var(--mute);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
main{flex:1;position:relative;overflow:hidden;min-height:0}
#tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{background:none;border-radius:0;padding:4px 0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;position:relative}
#tabs button.on{color:var(--blue);font-weight:700}
#tabs .plus span{background:var(--blue);color:var(--on);width:46px;height:30px;border-radius:10px;display:grid;place-items:center}
#tabs b{position:absolute;top:0;left:56%;background:#e5484d;color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:9px 18px;background:var(--surf);color:var(--ink)}
button.pri{background:var(--blue);color:var(--on)}button.line{background:none;border:1px solid var(--line)}
button:disabled{opacity:.6}
svg{display:block}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}.feed::-webkit-scrollbar{display:none}
.reel{height:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always;background:#0a1330;overflow:hidden;color:#fff}
.bgi{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(28px) brightness(.5)}
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.shade{position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(transparent,rgba(5,12,40,.88))}
.topbar{position:absolute;top:0;left:0;right:0;z-index:3;padding:10px 0 18px;background:linear-gradient(rgba(5,12,40,.65),transparent)}
.seg{display:flex;justify-content:center;gap:22px}.seg button{background:none;color:rgba(255,255,255,.65);padding:4px 2px;border-radius:0;font-size:15px}.seg button.on{color:#fff;border-bottom:2px solid #fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:rgba(255,255,255,.16);color:#fff;padding:5px 12px;font-size:12px;font-weight:500;backdrop-filter:blur(6px)}.chips button.on{background:#fff;color:var(--blue);font-weight:700}
.info{position:absolute;left:14px;right:80px;bottom:18px;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.who{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;cursor:pointer}
.info p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;max-height:5.8em;overflow:hidden}.info a{color:#a9c2ff;font-weight:600;cursor:pointer}
.pill{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.side{position:absolute;right:10px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:15px}
.side .a{position:relative;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;background:var(--blue);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none;cursor:pointer;object-fit:cover}
.side .av{border:2px solid #fff}.av.s{width:40px;height:40px}.av.xl{width:92px;height:92px;font-size:36px;margin:0 auto;border:3px solid var(--bg);box-shadow:var(--sh)}
.fplus{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;padding:0;font-weight:800;font-size:15px;line-height:20px}
.ab{background:none;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.ab.on{color:#6f9bff}
.arr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(11,42,111,.6);color:#fff;width:32px;height:32px;padding:0;display:grid;place-items:center}.arr.l{left:8px}.arr.r{right:66px}
.dots{position:absolute;top:60px;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:0 14px;z-index:2}.dots i{flex:1;max-width:34px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.dots i.a{background:#fff}
.vb{width:15px;height:15px;flex:none;display:inline-block;vertical-align:-2px;margin-left:4px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:64%;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;z-index:6}
.sheet h4{margin:0;padding:15px;text-align:center;border-bottom:1px solid var(--line);position:relative;font-size:14px}.sheet h4 button{position:absolute;right:8px;top:6px;background:none;color:var(--mute);padding:6px}
.list{flex:1;overflow-y:auto;padding:6px 14px}
.cmt{display:flex;gap:10px;padding:9px 0}.cmt .t{flex:1;word-break:break-word}.cmt b{cursor:pointer}.cmt .m{font-size:12px;color:var(--mute)}.cmt .m a{color:var(--mute);cursor:pointer;margin-left:10px;font-weight:500}
.row{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;padding:11px 13px;margin-bottom:10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}.row input{margin:0}
.scroll{height:100%;overflow-y:auto;padding:18px 16px 28px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mute);padding:30px}
.card{border:1px solid var(--line);border-radius:20px;padding:20px;background:var(--bg);box-shadow:var(--sh)}
.hero{text-align:center;margin:10px 0 22px}.hero .mark{width:56px;height:56px;font-size:30px;border-radius:16px;margin:0 auto 12px}.hero h1{margin:0;font-size:26px;letter-spacing:-.6px}.sub{font-size:12.5px;color:var(--mute)}
.or{text-align:center;color:var(--mute);font-size:12px;margin:12px 0}
.gbtn{width:100%;display:flex;justify-content:center;align-items:center;gap:10px}
.err{color:#d23b3b;font-size:13px;min-height:18px;margin-bottom:6px}
.prev{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.prev img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.pf{text-align:center}.pf h2{margin:12px 0 0;font-size:20px;letter-spacing:-.3px}.bio{margin:6px auto 0;max-width:300px;color:var(--mute)}
.stats{display:flex;justify-content:center;gap:2px;margin:14px 0}
.stats button{background:none;border-radius:12px;color:var(--mute);padding:6px 12px;font-size:12px;font-weight:500}.stats button b{color:var(--ink);display:block;font-size:17px}.stats button.on{background:var(--surf)}
.acts{display:flex;gap:8px;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:12px}
.grid div{position:relative;aspect-ratio:3/4;background:var(--surf);cursor:pointer;overflow:hidden;border-radius:4px}.grid img{width:100%;height:100%;object-fit:cover}
.grid span{position:absolute;top:5px;right:5px;color:#fff;filter:drop-shadow(0 1px 2px #000)}
.ppl{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.ppl .n{flex:1;min-width:0}.ppl .n b{display:block}.ppl .n span{font-size:12px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppl button{padding:6px 14px;font-size:13px}.ppl .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.search{position:relative}.search svg{position:absolute;left:13px;top:12px;color:var(--mute)}.search input{padding-left:40px;border-radius:999px}
h3.sec{font-size:13px;color:var(--mute);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiles button{border-radius:14px;text-align:left;padding:14px;background:var(--surf)}
.tiles button:first-child{grid-column:span 2;background:var(--blue);color:var(--on)}
.back{position:absolute;top:12px;left:12px;z-index:4;background:rgba(11,42,111,.7);color:#fff;width:36px;height:36px;padding:0;display:grid;place-items:center}
.edav{position:relative;width:92px;margin:0 auto 14px}.edav label{position:absolute;right:-4px;bottom:-4px;background:var(--blue);color:var(--on);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
.tflt{display:flex;justify-content:center;margin-top:8px}.tflt button{background:rgba(255,255,255,.22);color:#fff;padding:4px 12px;font-size:12px;display:flex;gap:6px;align-items:center;backdrop-filter:blur(6px)}
.dz{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:20px;padding:36px 16px;text-align:center;cursor:pointer;background:var(--surf);margin-bottom:18px}.dz b{font-size:15px}.dz .ico{width:52px;height:52px;border-radius:16px;background:var(--blue);color:var(--on);display:grid;place-items:center;margin-bottom:4px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surf)}.th img{width:100%;height:100%;object-fit:cover}.th button{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}.th i{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:10px;background:var(--blue);color:var(--on);padding:1px 8px;border-radius:99px;font-weight:600}
.add{display:grid;place-items:center;border:2px dashed var(--line);border-radius:12px;aspect-ratio:1;cursor:pointer;color:var(--mute)}
.lbl{font-size:11.5px;font-weight:700;color:var(--mute);margin:4px 0 8px;text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between}
.tpk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}.tpk button{padding:7px 14px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:none}.tpk button.on{background:var(--blue);color:var(--on);border-color:var(--blue);font-weight:600}
.pubbar{position:sticky;bottom:-18px;background:var(--bg);padding:12px 0 6px;display:flex;gap:8px}.pubbar .pri{flex:1}
.pv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.shade,.bgi{pointer-events:none}.side{gap:11px}
.th .pb{position:absolute;inset:0;display:grid;place-items:center;color:#fff;pointer-events:none;filter:drop-shadow(0 1px 3px #000)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3)}
img.mark{background:#fff;padding:3px;object-fit:contain;border:1px solid var(--line)}
a{color:var(--acc);cursor:pointer;font-weight:600}

}

function reel(p){
  const n=p.images.length,i=S[p.id]||0,lk=likes.filter(l=>l.post===p.id),mine=lk.some(l=>l.uid===me),cc=cms.filter(c=>c.post===p.id).length,sv=saves.some(s=>s.post===p.id);
  return `<section class="reel"><div class="bgi" style="background-image:url('${esc(p.images[i])}')"></div>${p.video?`<video class="pv" data-id="${p.id}" src="${esc(p.video)}" poster="${esc(p.images[0])}" playsinline loop preload="metadata"></video>`:`<img class="pic" src="${esc(p.images[i])}" alt="">`}
  ${n>1?`<div class="dots">${p.images.map((_,k)=>`<i class="${k===i?'a':''}"></i>`).join('')}</div><button class="arr l" data-sl="${p.id}:-1">${ic('l',20)}</button><button class="arr r" data-sl="${p.id}:1">${ic('r',20)}</button>`:''}
  <div class="shade"></div>
  <div class="info"><div class="who" data-user="${esc(p.author)}">@${esc(nm(p.author))}${badge(p.author)}</div>${p.caption?`<p>${fmt(p.caption)}</p>`:''}<span class="pill">${esc(p.topic||'General')}${n>1?' · '+n+' slides':''}${p.video?' · Video':''} · ${ago(p.createdAt)}</span></div>
  <div class="side"><div class="a">${av(p.author)}${p.author!==me&&!isF(me,p.author)?`<button class="fplus" data-fol="${esc(p.author)}">+</button>`:''}</div>
  <button class="ab ${mine?'on':''}" data-like="${p.id}">${ic('heart',30,mine)}${lk.length}</button>
  <button class="ab" data-cm="${p.id}">${ic('msg',28)}${cc}</button>
  <button class="ab ${sv?'on':''}" data-save="${p.id}">${ic('mark',27,sv)}${sv?'Saved':'Save'}</button>
  <button class="ab" data-share="${p.id}">${ic('share',26)}Share</button>${p.video?`<button class="ab" data-snd="1">${ic(MUTED?'mute':'vol',26)}${MUTED?'Muted':'Sound'}</button>`:''}
  ${p.author===me?`<button class="ab" data-editcap="${p.id}">${ic('edit',24)}Edit</button><button class="ab" data-del="${p.id}">${ic('trash',24)}Delete</button>`:''}</div></section>`;
}
function sheet(){
  if(!openC)return '';const cs=cms.filter(c=>c.post===openC);
  return `<div class="sheet"><h4>${cs.length} comment${cs.length===1?'':'s'}<button data-cm="${openC}">${ic('x',20)}</button></h4><div class="list">${cs.map(c=>`<div class="cmt">${av(c.uid,'s')}<div class="t"><b data-user="${esc(c.uid)}">${esc(nm(c.uid))}</b>${badge(c.uid)} ${esc(c.text)}<div class="m">${ago(c.createdAt)}${c.uid===me?`<a data-editcm="${c.id}">Edit</a><a data-delcm="${c.id}">Delete</a>`:''}</div></div></div>`).join('')||'<div class="sub" style="text-align:center;margin-top:40px">No comments yet. Say something helpful!</div>'}</div><div class="row"><input id="ci-${openC}" placeholder="Add a comment…" maxlength="300"><button class="pri" data-send="${openC}">Send</button></div></div>`;
}
function viewPost(K){
  const p=posts.find(x=>x.id===V.id)||EX[V.id];
  if(!p&&!EX['_'+V.id]){EX['_'+V.id]=1;getDoc(doc(db,'posts',V.id)).then(x=>{if(x.exists())EX[V.id]={id:x.id,...x.data()};EX['_'+V.id]=2;draw(true)}).catch(()=>{EX['_'+V.id]=2;draw(true)})}
  app.innerHTML=p?`<div class="feed" data-k="${K}">${reel(p)}</div><button class="back" data-back="1">${ic('l',20)}</button>`:`<div class="empty">${EX['_'+V.id]===2?'Post not found.':'Loading…'}</div><button class="back" data-back="1">${ic('l',20)}</button>`;
}
function newView(K){
  const n=draft.length,has=n||VF,kb=Math.round(draft.join('').length*.75/1024),mmss=t=>Math.floor(t/60)+':'+String(Math.round(t%60)).padStart(2,'0');
  app.innerHTML=`<div class="scroll" data-k="${K}"><h3 style="margin:0 0 4px;font-size:20px;letter-spacing:-.3px">New post</h3><div class="sub" style="margin-bottom:16px">${VIDEO_ON?'Share pictures, a slide post, or a short video.':'Share a picture, or add several to make a slide post.'}</div>
  ${VF?`<div class="lbl"><span>Video · ${mmss(VM.d)}</span><span>${(VF.size/1048576).toFixed(1)} MB</span></div><div class="thumbs"><div class="th" style="grid-column:span 2;aspect-ratio:3/4"><img src="${VM.thumb}" alt=""><button data-rmvid="1">${ic('x',12)}</button><span class="pb">${ic('play',26,1)}</span></div></div>`
  :n?`<div class="lbl"><span>${n} of 8 · ${n>1?'Slide post':'Single picture'}</span><span>${kb} KB</span></div><div class="thumbs">${draft.map((d,i)=>`<div class="th"><img src="${d}" alt=""><button data-rmimg="${i}">${ic('x',12)}</button>${i===0?'<i>Cover</i>':''}</div>`).join('')}${n<8?`<label class="add" for="f">${ic('plus',22)}</label>`:''}</div>`
  :`<label class="dz" for="f"><span class="ico">${ic('cam',24)}</span><b>Tap to add ${VIDEO_ON?'pictures or a video':'pictures'}</b><span class="sub">Up to 8 pictures (more than one makes a slide post)${VIDEO_ON?', or one video up to 90 seconds and 50 MB':''}.</span></label>`}

}
function person(id,sub){return `<div class="ppl" data-user="${esc(id)}">${av(id,'s')}<div class="n"><b>${esc(nm(id))}${badge(id)}</b><span>${esc(sub??U[id]?.bio??'')}</span></div>${id!==me?`<button class="${isF(me,id)?'':'pri'}" data-fol="${esc(id)}">${isF(me,id)?'Following':isF(id,me)?'Follow back':'Follow'}</button>`:''}</div>`}
function pgrid(l){return l.length?`<div class="grid">${l.map(p=>`<div data-view="${p.id}"><img src="${esc(p.images[0])}" alt="">${p.video?`<span>${ic('play',16,1)}</span>`:p.images.length>1?`<span>${ic('grid',16)}</span>`:''}</div>`).join('')}</div>`:'<div class="sub" style="text-align:center;padding:40px 0">Nothing here yet.</div>'}
function profile(u,K){
  const mp=posts.filter(p=>p.author===u),fr=fol.filter(x=>x.to===u),fg=fol.filter(x=>x.from===u),own=u===me;let body;
  if(PT==='followers')body=fr.map(x=>person(x.from)).join('')||'<div class="sub" style="text-align:center;padding:40px 0">No followers yet.</div>';
  else if(PT==='following')body=fg.map(x=>person(x.to)).join('')||'<div class="sub" style="text-align:center;padding:40px 0">Not following anyone yet.</div>';
  else if(PT==='saved'&&own)body=pgrid(saves.map(s=>posts.find(p=>p.id===s.post)).filter(Boolean));
  else body=pgrid(mp);
  const b=(k,n,l)=>`<button class="${PT===k?'on':''}" data-pt="${k}"><b>${n}</b>${l}</button>`;
  app.innerHTML=`<div class="scroll" data-k="${K}"><div class="pf">${av(u,'xl')}<h2>${esc(nm(u))}${badge(u)}</h2>${U[u]?.bio?`<div class="bio">${fmt(U[u].bio)}</div>`:own?'<div class="bio">Add a short bio so people know you.</div>':''}
  <div class="stats">${b('posts',mp.length,'Posts')}${b('followers',fr.length,'Followers')}${b('following',fg.length,'Following')}${own?b('saved',saves.length,'Saved'):''}</div>
  <div class="acts">${own?'<button class="line" data-go="edit">Edit profile</button><button data-out="1">Log out</button>':`<button class="${isF(me,u)?'':'pri'}" data-fol="${esc(u)}">${isF(me,u)?'Following':'Follow'}</button>`}</div></div>${body}</div>`;
}

function res(){
  const q=Q.trim().toLowerCase();
  if(q.startsWith('#')){const t=q.slice(1);return `<h3 class="sec">Posts tagged #${esc(t)}</h3>`+pgrid(posts.filter(p=>(p.tags||[]).includes(t)))}
  if(q){const l=Object.keys(U).filter(id=>nm(id).toLowerCase().includes(q));return l.map(id=>person(id)).join('')||'<div class="sub" style="text-align:center;padding:40px 0">No creators found.</div>'}
  const sug=Object.keys(U).filter(id=>id!==me&&!isF(me,id)).sort((a,b)=>(U[b].verified?1:0)-(U[a].verified?1:0)).slice(0,8);
  return `<h3 class="sec">Topics</h3><div class="tiles">${T.slice().reverse().map(t=>`<button data-tp="${t}">${t}</button>`).join('')}</div><h3 class="sec">Creators to follow</h3>${sug.map(id=>person(id)).join('')||'<div class="sub">No one else yet.</div>'}`;
}
function inbox(K){
  const tx={like:'liked your post',comment:'commented on your post',follow:'started following you'};
  app.innerHTML=`<div class="scroll" data-k="${K}"><h3 style="margin:0 0 6px">Notifications</h3>${notifs.map(n=>`<div class="ppl" data-notif="${n.id}">${av(n.from,'s')}<div class="n"><b>${esc(nm(n.from))}${badge(n.from)}</b><span>${tx[n.type]||''} · ${ago(n.createdAt)}</span></div>${n.read?'':'<i class="dot"></i>'}</div>`).join('')||'<div class="sub" style="text-align:center;padding:60px 0">No notifications yet.</div>'}</div>`;
}
function notify(to,type,post,id){if(to&&to!==me)setDoc(doc(db,'notifs',id||crypto.randomUUID()),{to,from:me,type,post:post||'',createdAt:Date.now(),read:false}).catch(()=>{})}
function sq(file,s=240){return new Promise(r=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);r(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(file)})}
function shrink(file){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.65))};im.src=URL.createObjectURL(file)})}
function slide(id,d){const p=posts.find(x=>x.id===id);if(p&&p.images.length>1){S[id]=((S[id]||0)+d+p.images.length)%p.images.length}}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function vmeta(f){return new Promise((res,rej)=>{const v=document.createElement('video');v.preload='metadata';v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(f);v.onerror=rej;v.onloadedmetadata=()=>{v.currentTime=Math.min(.5,v.duration/2)};v.onseeked=()=>{const k=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);res({d:v.duration,thumb:c.toDataURL('image/jpeg',.7)})}})}
function setupVideos(vs){
  const vids=[...app.querySelectorAll('video.pv')];if(VIO)VIO.disconnect();if(!vids.length)return;
  vids.forEach(v=>{v.muted=MUTED;if(vs&&v.dataset.id===vs.id)v.currentTime=vs.t});
  VIO=new IntersectionObserver(es=>es.forEach(en=>{const v=en.target;if(en.isIntersecting&&en.intersectionRatio>.6){if(!PAUSED.has(v.dataset.id))v.play().catch(()=>{})}else v.pause()}),{root:app.querySelector('.feed'),threshold:[0,.6]});
  vids.forEach(v=>VIO.observe(v));
}
const A={
  mode:v=>{mode=v},
  google:async()=>{await signInWithPopup(auth,new GoogleAuthProvider());if(!PEND)V={t:'feed'}},
  auth:async()=>{const em=$('#a-email').value.trim(),pw=$('#a-pass').value;
    if(mode==='up'){const n=$('#a-name').value.trim();if(!n){authErr='Please enter your name.';return}
      signingUp=true;try{const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:n});names[c.user.uid]=n;
      await setDoc(doc(db,'users',c.user.uid),{name:n,bio:'',photo:'',verified:false,createdAt:Date.now()})}finally{signingUp=false}}
    else await signInWithEmailAndPassword(auth,em,pw);if(!PEND)V={t:'feed'}},
  out:async()=>{await signOut(auth);PEND=null;V={t:'feed'}},
  go:v=>{openC=null;V={t:v};PT='posts';if(v==='disc')Q='';if(v==='edit')EPh=null},
  user:v=>{openC=null;V={t:'me',u:v};PT='posts'},
  pt:v=>{PT=v},
  view:v=>{openC=null;V={t:'view',id:v,prev:V}},
  back:()=>{V=V.prev||{t:'feed'}},
  sl:v=>{const[id,s]=v.split(':');slide(id,+s)},
  fm:v=>{F.mode=v},topic:v=>{F.topic=v},
  tp:v=>{F.topic=v;F.mode='for';V={t:'feed'}},
  tag:v=>{V={t:'disc'};Q='#'+v},
  like:async v=>{const id=v+'__'+me;if(likes.some(l=>l.id===id))await deleteDoc(doc(db,'likes',id));else{await setDoc(doc(db,'likes',id),{post:v,uid:me});notify(posts.find(p=>p.id===v)?.author,'like',v,'like_'+id)}},
  save:async v=>{const id=v+'__'+me;saves.some(s=>s.id===id)?await deleteDoc(doc(db,'saves',id)):await setDoc(doc(db,'saves',id),{post:v,uid:me})},
  cm:v=>{openC=openC===v?null:v},
  send:async v=>{const i=$('#ci-'+v),t=i.value.trim();if(!t)return;i.value='';
    await setDoc(doc(collection(db,'comments')),{post:v,uid:me,name:nm(me),text:t,createdAt:Date.now()});notify(posts.find(p=>p.id===v)?.author,'comment',v)},
  editcm:async v=>{const c=cms.find(x=>x.id===v),t=prompt('Edit your comment',c.text);if(t&&t.trim())await updateDoc(doc(db,'comments',v),{text:t.trim().slice(0,300)})},
  delcm:async v=>{if(confirm('Delete this comment?'))await deleteDoc(doc(db,'comments',v))},
  editcap:async v=>{const p=posts.find(x=>x.id===v),t=prompt('Edit caption',p.caption||'');if(t!==null)await updateDoc(doc(db,'posts',v),{caption:t.trim().slice(0,500),tags:tagsOf(t)})},
  del:async v=>{if(confirm('Delete this post?')){await deleteDoc(doc(db,'posts',v));if(V.t==='view')V=V.prev||{t:'feed'}}},
  fol:async v=>{const id=me+'__'+v;if(isF(me,v))await deleteDoc(doc(db,'follows',id));else{await setDoc(doc(db,'follows',id),{from:me,to:v});notify(v,'follow','','follow_'+id)}},
  notif:v=>{const n=notifs.find(x=>x.id===v);V=n.type==='follow'?{t:'me',u:n.from}:{t:'view',id:n.post,prev:{t:'inbox'}};PT='posts'},
  clear:()=>{draft=[];VF=VM=null;CAP='';NT='Study Notes';NTc=false},rmvid:()=>{VF=VM=null},snd:()=>{MUTED=!MUTED},
  share:async v=>{const p=posts.find(x=>x.id===v)||EX[v],url=location.origin+location.pathname+'?post='+v;
    try{if(navigator.share){await navigator.share({title:'Zen Tok',text:(p?.caption||'Check this out on Zen Tok').slice(0,100),url});return}}catch(e){if(e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){prompt('Copy this link',url)}},rmimg:v=>{draft.splice(+v,1)},tpick:v=>{NT=v;NTc=true},
  pub:async()=>{
    if(!draft.length&&!VF){authErr='Add a picture or a video.';return}
    if(!VF&&draft.join('').length>900000){authErr='Pictures are too large. Remove one or two.';return}
    busy=true;UP=0;draw(true);const c=CAP.trim();let extra={};
    if(VF){const fd=new FormData();fd.append('file',VF);fd.append('upload_preset',UPLOAD_PRESET);fd.append('folder','zentok');
      const r=await new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`);
        x.upload.onprogress=ev=>{if(ev.lengthComputable){UP=Math.round(ev.loaded/ev.total*100);const b=$('#pubbtn');if(b)b.textContent='Uploading '+UP+'%'}};
        x.onload=()=>{try{const j=JSON.parse(x.responseText);x.status<300&&j.secure_url?ok(j):no({code:'cloud'})}catch(e){no({code:'cloud'})}};x.onerror=()=>no({code:'cloud'});x.send(fd)});
      extra={video:r.secure_url}}
    await setDoc(doc(collection(db,'posts')),{author:me,authorName:nm(me),caption:c,tags:tagsOf(c),topic:NT,images:VF?[VM.thumb]:draft,...extra,createdAt:Date.now()});
    busy=false;draft=[];VF=VM=null;CAP='';NT='Study Notes';NTc=false;V={t:'feed'}},
  saveprof:async()=>{const n=$('#e-name').value.trim()||nm(me),d={name:n,bio:$('#e-bio').value.trim()};if(EPh)d.photo=EPh;
    await updateDoc(doc(db,'users',me),d);await updateProfile(auth.currentUser,{displayName:n});EPh=null;V={t:'me'}}
};
const sel=Object.keys(A).map(k=>`[data-${k}]`).join(',');
document.addEventListener('click',async e=>{
  if(e.target.matches('video.pv')){const v=e.target;if(v.paused){PAUSED.delete(v.dataset.id);v.play().catch(()=>{})}else{PAUSED.add(v.dataset.id);v.pause()}return}
  const t=e.target.closest(sel);if(!t)return;authErr='';
  const k=Object.keys(A).find(k=>k in t.dataset);
  try{await A[k](t.dataset[k])}catch(err){busy=false;authErr=fix(err.code)}
  draw(true);
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const r=e.target.closest('.reel');if(!r)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){const b=r.querySelector('.arr.'+(dx<0?'r':'l'));if(b)b.click()}});
document.addEventListener('change',async e=>{
  if(e.target.id==='f'){authErr='';const fs=[...e.target.files],vf=VIDEO_ON&&fs.find(f=>f.type.startsWith('video/'));
    if(vf){if(vf.size>50*1048576){authErr='That video is bigger than 50 MB.';return newView('new')}
      try{const m=await vmeta(vf);if(m.d>90){authErr='That video is longer than 90 seconds.';return newView('new')}VF=vf;VM=m;draft=[]}catch(x){authErr='Could not read that video. Try an MP4 file.';return newView('new')}}
    else{VF=VM=null;for(const f of fs.filter(f=>f.type.startsWith('image/')).slice(0,8-draft.length))draft.push(await shrink(f))}
    if(draft.length>1&&!NTc)NT='Study Slides';newView('new')}
  if(e.target.id==='pf'){EPh=await sq(e.target.files[0]);const n=$('#e-name').value,b=$('#e-bio').value;editView('edit');$('#e-name').value=n;$('#e-bio').value=b}});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;$('#res').innerHTML=res()}if(e.target.id==='cap'){CAP=e.target.value;$('#capn').textContent=CAP.length}});
document.addEventListener('focusout',()=>{if(pend)setTimeout(()=>draw(),50)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id||'';if(id.startsWith('ci-'))document.querySelector(`[data-send="${id.slice(3)}"]`).click();else if(id.startsWith('a-'))document.querySelector('[data-auth]').click()});
