a{color:var(--acc);cursor:pointer;font-weight:600}
</style></head><body>

<script type="module">

  apiKey:"AIzaSyAYsGEsUtc_Id2WhqNRSB1qIh0lL4ydVqM",

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const T=['Maths','Physics','Chemistry','Biology','English','UTME Tips','Study Notes','Study Slides'];
const P={home:"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10",search:"M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35",plus:"M12 5v14M5 12h14",bell:"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0",user:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",heart:"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z",msg:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",mark:"M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z",x:"M18 6L6 18M6 6l12 12",edit:"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",trash:"M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2",l:"M15 18l-6-6 6-6",r:"M9 18l6-6-6-6",cam:"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",grid:"M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"};

let NT='Study Notes',NTc=false,CAP='',me=null,posts=[],likes=[],cms=[],fol=[],saves=[],notifs=[],U={},names={},unsubs=[],V={t:'feed'},F={mode:'for',topic:''},PT='posts',S={},openC=null,draft=[],EPh=null,Q='',busy=false,pend=false,mode='in',authErr='',signingUp=false;
const $=s=>document.querySelector(s),app=$('#app');

  unsubs.forEach(f=>f());unsubs=[];me=u?u.uid:null;

    const sub=(q,set)=>unsubs.push(onSnapshot(q,s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));draw()},e=>{authErr=fix(e.code);draw()}));

  }
  draw(true);
});

function draw(force){
  if(!force&&me&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)&&document.activeElement.value){pend=true;return}

  const K=V.t+(V.u||'')+(V.id||'')+F.mode+F.topic+PT,sc=app.querySelector('.feed,.scroll'),top=sc?sc.scrollTop:0,same=sc&&sc.dataset.k===K;

}

  const up=mode==='up';
  app.innerHTML=`<div class="scroll"><div class="hero"><div class="mark">Z</div><h1>${up?'Join Zen Tok':'Welcome back'}</h1><div class="sub">Study smarter with slides, notes and tips from the Zenova Study community.</div></div>
  <div class="card"><button class="gbtn line" data-google="1"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
  <div class="or">or use email</div>
  ${up?'<input id="a-name" placeholder="Your name" maxlength="30">':''}
  <input id="a-email" type="email" placeholder="Email" autocomplete="email"><input id="a-pass" type="password" placeholder="Password (6+ characters)" autocomplete="${up?'new-password':'current-password'}">
  <div class="err">${esc(authErr)}</div><button class="pri" data-auth="1" style="width:100%">${up?'Create account':'Log in'}</button>
  <p class="sub" style="text-align:center;margin:14px 0 0">${up?'Already have an account?':'New here?'} <a data-mode="${up?'in':'up'}">${up?'Log in':'Create an account'}</a></p></div></div>`;
}
function reel(p){
  const n=p.images.length,i=S[p.id]||0,lk=likes.filter(l=>l.post===p.id),mine=lk.some(l=>l.uid===me),cc=cms.filter(c=>c.post===p.id).length,sv=saves.some(s=>s.post===p.id);
  return `<section class="reel"><div class="bgi" style="background-image:url('${esc(p.images[i])}')"></div><img class="pic" src="${esc(p.images[i])}" alt="">
  ${n>1?`<div class="dots">${p.images.map((_,k)=>`<i class="${k===i?'a':''}"></i>`).join('')}</div><button class="arr l" data-sl="${p.id}:-1">${ic('l',20)}</button><button class="arr r" data-sl="${p.id}:1">${ic('r',20)}</button>`:''}
  <div class="shade"></div>
  <div class="info"><div class="who" data-user="${esc(p.author)}">@${esc(nm(p.author))}${badge(p.author)}</div>${p.caption?`<p>${fmt(p.caption)}</p>`:''}<span class="pill">${esc(p.topic||'General')}${n>1?' · '+n+' slides':''} · ${ago(p.createdAt)}</span></div>
  <div class="side"><div class="a">${av(p.author)}${p.author!==me&&!isF(me,p.author)?`<button class="fplus" data-fol="${esc(p.author)}">+</button>`:''}</div>
  <button class="ab ${mine?'on':''}" data-like="${p.id}">${ic('heart',30,mine)}${lk.length}</button>
  <button class="ab" data-cm="${p.id}">${ic('msg',28)}${cc}</button>
  <button class="ab ${sv?'on':''}" data-save="${p.id}">${ic('mark',27,sv)}${sv?'Saved':'Save'}</button>
  ${p.author===me?`<button class="ab" data-editcap="${p.id}">${ic('edit',24)}Edit</button><button class="ab" data-del="${p.id}">${ic('trash',24)}Delete</button>`:''}</div></section>`;
}
function sheet(){
  if(!openC)return '';const cs=cms.filter(c=>c.post===openC);
  return `<div class="sheet"><h4>${cs.length} comment${cs.length===1?'':'s'}<button data-cm="${openC}">${ic('x',20)}</button></h4><div class="list">${cs.map(c=>`<div class="cmt">${av(c.uid,'s')}<div class="t"><b data-user="${esc(c.uid)}">${esc(nm(c.uid))}</b>${badge(c.uid)} ${esc(c.text)}<div class="m">${ago(c.createdAt)}${c.uid===me?`<a data-editcm="${c.id}">Edit</a><a data-delcm="${c.id}">Delete</a>`:''}</div></div></div>`).join('')||'<div class="sub" style="text-align:center;margin-top:40px">No comments yet. Say something helpful!</div>'}</div><div class="row"><input id="ci-${openC}" placeholder="Add a comment…" maxlength="300"><button class="pri" data-send="${openC}">Send</button></div></div>`;
}
function viewPost(K){const p=posts.find(x=>x.id===V.id);app.innerHTML=p?`<div class="feed" data-k="${K}">${reel(p)}</div><button class="back" data-back="1">${ic('l',20)}</button>`:'<div class="empty">Post not found.</div>'}
function newView(K){
  const n=draft.length,kb=Math.round(draft.join('').length*.75/1024);
  app.innerHTML=`<div class="scroll" data-k="${K}"><h3 style="margin:0 0 4px;font-size:20px;letter-spacing:-.3px">New post</h3><div class="sub" style="margin-bottom:16px">Share a picture, or add several to make a slide post.</div>
  ${n?`<div class="lbl"><span>${n} of 8 · ${n>1?'Slide post':'Single picture'}</span><span>${kb} KB</span></div><div class="thumbs">${draft.map((d,i)=>`<div class="th"><img src="${d}" alt=""><button data-rmimg="${i}">${ic('x',12)}</button>${i===0?'<i>Cover</i>':''}</div>`).join('')}${n<8?`<label class="add" for="f">${ic('plus',22)}</label>`:''}</div>`
  :`<label class="dz" for="f"><span class="ico">${ic('cam',24)}</span><b>Tap to add pictures</b><span class="sub">Up to 8 pictures. More than one becomes a swipeable slide post.</span></label>`}
  <input type="file" id="f" accept="image/*" multiple hidden>
  <div class="lbl">Topic</div><div class="tpk">${T.map(t=>`<button data-tpick="${t}" class="${NT===t?'on':''}">${t}</button>`).join('')}</div>
  <div class="lbl"><span>Caption</span><span><span id="capn">${CAP.length}</span>/500</span></div>
  <textarea id="cap" rows="4" maxlength="500" placeholder="Write a caption… add #hashtags so people can find it">${esc(CAP)}</textarea>
  <div class="err">${esc(authErr)}</div>
  <div class="pubbar"><button class="pri" data-pub="1" ${busy||!n?'disabled':''}>${busy?'Posting…':'Share post'}</button>${n?'<button data-clear="1">Clear</button>':''}</div></div>`;
}
function person(id,sub){return `<div class="ppl" data-user="${esc(id)}">${av(id,'s')}<div class="n"><b>${esc(nm(id))}${badge(id)}</b><span>${esc(sub??U[id]?.bio??'')}</span></div>${id!==me?`<button class="${isF(me,id)?'':'pri'}" data-fol="${esc(id)}">${isF(me,id)?'Following':isF(id,me)?'Follow back':'Follow'}</button>`:''}</div>`}
function pgrid(l){return l.length?`<div class="grid">${l.map(p=>`<div data-view="${p.id}"><img src="${esc(p.images[0])}" alt="">${p.images.length>1?`<span>${ic('grid',16)}</span>`:''}</div>`).join('')}</div>`:'<div class="sub" style="text-align:center;padding:40px 0">Nothing here yet.</div>'}
function profile(u,K){
  const mp=posts.filter(p=>p.author===u),fr=fol.filter(x=>x.to===u),fg=fol.filter(x=>x.from===u),own=u===me;let body;
  if(PT==='followers')body=fr.map(x=>person(x.from)).join('')||'<div class="sub" style="text-align:center;padding:40px 0">No followers yet.</div>';
  else if(PT==='following')body=fg.map(x=>person(x.to)).join('')||'<div class="sub" style="text-align:center;padding:40px 0">Not following anyone yet.</div>';
  else if(PT==='saved'&&own)body=pgrid(saves.map(s=>posts.find(p=>p.id===s.post)).filter(Boolean));
  else body=pgrid(mp);
  const b=(k,n,l)=>`<button class="${PT===k?'on':''}" data-pt="${k}"><b>${n}</b>${l}</button>`;
  app.innerHTML=`<div class="scroll" data-k="${K}"><div class="pf">${av(u,'xl')}<h2>${esc(nm(u))}${badge(u)}</h2>${U[u]?.bio?`<div class="bio">${fmt(U[u].bio)}</div>`:own?'<div class="bio">Add a short bio so people know you.</div>':''}
  <div class="stats">${b('posts',mp.length,'Posts')}${b('followers',fr.length,'Followers')}${b('following',fg.length,'Following')}${own?b('saved',saves.length,'Saved'):''}</div>
  <div class="acts">${own?'<button class="line" data-go="edit">Edit profile</button><button data-out="1">Log out</button>':`<button class="${isF(me,u)?'':'pri'}" data-fol="${esc(u)}">${isF(me,u)?'Following':'Follow'}</button>`}</div></div>${body}</div>`;
}
function editView(K){
  const u=U[me]||{};
  app.innerHTML=`<div class="scroll" data-k="${K}"><div class="card"><h3 style="margin:0 0 14px">Edit profile</h3>
  <div class="edav">${EPh?`<img class="av xl" src="${EPh}" alt="">`:av(me,'xl')}<label for="pf">${ic('cam',16)}</label><input type="file" id="pf" accept="image/*" hidden></div>
  <input id="e-name" value="${esc(u.name||nm(me))}" maxlength="30" placeholder="Name"><textarea id="e-bio" rows="3" maxlength="120" placeholder="One-line bio (e.g. UTME tutor · Physics)">${esc(u.bio||'')}</textarea>
  <div class="err">${esc(authErr)}</div><div style="display:flex;gap:8px"><button class="pri" data-saveprof="1">Save</button><button data-go="me">Cancel</button></div></div></div>`;
}
function discView(K){
  app.innerHTML=`<div class="scroll" data-k="${K}"><div class="search">${ic('search',18)}<input id="q" value="${esc(Q)}" placeholder="Search creators or #hashtags" autocomplete="off"></div><div id="res">${res()}</div></div>`;
}
function res(){
  const q=Q.trim().toLowerCase();
  if(q.startsWith('#')){const t=q.slice(1);return `<h3 class="sec">Posts tagged #${esc(t)}</h3>`+pgrid(posts.filter(p=>(p.tags||[]).includes(t)))}
  if(q){const l=Object.keys(U).filter(id=>nm(id).toLowerCase().includes(q));return l.map(id=>person(id)).join('')||'<div class="sub" style="text-align:center;padding:40px 0">No creators found.</div>'}
  const sug=Object.keys(U).filter(id=>id!==me&&!isF(me,id)).sort((a,b)=>(U[b].verified?1:0)-(U[a].verified?1:0)).slice(0,8);
  return `<h3 class="sec">Topics</h3><div class="tiles">${T.slice().reverse().map(t=>`<button data-tp="${t}">${t}</button>`).join('')}</div><h3 class="sec">Creators to follow</h3>${sug.map(id=>person(id)).join('')||'<div class="sub">No one else yet.</div>'}`;
}
function inbox(K){
  const tx={like:'liked your post',comment:'commented on your post',follow:'started following you'};
  app.innerHTML=`<div class="scroll" data-k="${K}"><h3 style="margin:0 0 6px">Notifications</h3>${notifs.map(n=>`<div class="ppl" data-notif="${n.id}">${av(n.from,'s')}<div class="n"><b>${esc(nm(n.from))}${badge(n.from)}</b><span>${tx[n.type]||''} · ${ago(n.createdAt)}</span></div>${n.read?'':'<i class="dot"></i>'}</div>`).join('')||'<div class="sub" style="text-align:center;padding:60px 0">No notifications yet.</div>'}</div>`;
}
function notify(to,type,post,id){if(to&&to!==me)setDoc(doc(db,'notifs',id||crypto.randomUUID()),{to,from:me,type,post:post||'',createdAt:Date.now(),read:false}).catch(()=>{})}
function sq(file,s=240){return new Promise(r=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);r(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(file)})}
function shrink(file){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.65))};im.src=URL.createObjectURL(file)})}
function slide(id,d){const p=posts.find(x=>x.id===id);if(p&&p.images.length>1){S[id]=((S[id]||0)+d+p.images.length)%p.images.length}}
const A={
  mode:v=>{mode=v},
  google:async()=>{await signInWithPopup(auth,new GoogleAuthProvider());V={t:'feed'}},
  auth:async()=>{const em=$('#a-email').value.trim(),pw=$('#a-pass').value;
    if(mode==='up'){const n=$('#a-name').value.trim();if(!n){authErr='Please enter your name.';return}
      signingUp=true;try{const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:n});names[c.user.uid]=n;
      await setDoc(doc(db,'users',c.user.uid),{name:n,bio:'',photo:'',verified:false,createdAt:Date.now()})}finally{signingUp=false}}
    else await signInWithEmailAndPassword(auth,em,pw);V={t:'feed'}},
  out:async()=>{await signOut(auth);V={t:'feed'}},
  go:v=>{openC=null;V={t:v};PT='posts';if(v==='disc')Q='';if(v==='edit')EPh=null},
  user:v=>{openC=null;V={t:'me',u:v};PT='posts'},
  pt:v=>{PT=v},
  view:v=>{openC=null;V={t:'view',id:v,prev:V}},
  back:()=>{V=V.prev||{t:'feed'}},
  sl:v=>{const[id,s]=v.split(':');slide(id,+s)},
  fm:v=>{F.mode=v},topic:v=>{F.topic=v},
  tp:v=>{F.topic=v;F.mode='for';V={t:'feed'}},
  tag:v=>{V={t:'disc'};Q='#'+v},
  like:async v=>{const id=v+'__'+me;if(likes.some(l=>l.id===id))await deleteDoc(doc(db,'likes',id));else{await setDoc(doc(db,'likes',id),{post:v,uid:me});notify(posts.find(p=>p.id===v)?.author,'like',v,'like_'+id)}},
  save:async v=>{const id=v+'__'+me;saves.some(s=>s.id===id)?await deleteDoc(doc(db,'saves',id)):await setDoc(doc(db,'saves',id),{post:v,uid:me})},
  cm:v=>{openC=openC===v?null:v},
  send:async v=>{const i=$('#ci-'+v),t=i.value.trim();if(!t)return;i.value='';
    await setDoc(doc(collection(db,'comments')),{post:v,uid:me,name:nm(me),text:t,createdAt:Date.now()});notify(posts.find(p=>p.id===v)?.author,'comment',v)},
  editcm:async v=>{const c=cms.find(x=>x.id===v),t=prompt('Edit your comment',c.text);if(t&&t.trim())await updateDoc(doc(db,'comments',v),{text:t.trim().slice(0,300)})},
  delcm:async v=>{if(confirm('Delete this comment?'))await deleteDoc(doc(db,'comments',v))},
  editcap:async v=>{const p=posts.find(x=>x.id===v),t=prompt('Edit caption',p.caption||'');if(t!==null)await updateDoc(doc(db,'posts',v),{caption:t.trim().slice(0,500),tags:tagsOf(t)})},
  del:async v=>{if(confirm('Delete this post?')){await deleteDoc(doc(db,'posts',v));if(V.t==='view')V=V.prev||{t:'feed'}}},
  fol:async v=>{const id=me+'__'+v;if(isF(me,v))await deleteDoc(doc(db,'follows',id));else{await setDoc(doc(db,'follows',id),{from:me,to:v});notify(v,'follow','','follow_'+id)}},
  notif:v=>{const n=notifs.find(x=>x.id===v);V=n.type==='follow'?{t:'me',u:n.from}:{t:'view',id:n.post,prev:{t:'inbox'}};PT='posts'},
  clear:()=>{draft=[];CAP='';NT='Study Notes';NTc=false},rmimg:v=>{draft.splice(+v,1)},tpick:v=>{NT=v;NTc=true},
  pub:async()=>{
    if(!draft.length){authErr='Add at least one picture.';return}
    if(draft.join('').length>900000){authErr='Pictures are too large. Remove one or two.';return}
    busy=true;draw(true);const c=$('#cap').value.trim();
    await setDoc(doc(collection(db,'posts')),{author:me,authorName:nm(me),caption:c,tags:tagsOf(c),topic:NT,images:draft,createdAt:Date.now()});
    busy=false;draft=[];CAP='';NT='Study Notes';NTc=false;V={t:'feed'}},
  saveprof:async()=>{const n=$('#e-name').value.trim()||nm(me),d={name:n,bio:$('#e-bio').value.trim()};if(EPh)d.photo=EPh;
    await updateDoc(doc(db,'users',me),d);await updateProfile(auth.currentUser,{displayName:n});EPh=null;V={t:'me'}}
};
const sel=Object.keys(A).map(k=>`[data-${k}]`).join(',');
document.addEventListener('click',async e=>{
  const t=e.target.closest(sel);if(!t)return;authErr='';
  const k=Object.keys(A).find(k=>k in t.dataset);
  try{await A[k](t.dataset[k])}catch(err){busy=false;authErr=fix(err.code)}
  draw(true);
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const r=e.target.closest('.reel');if(!r)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){const b=r.querySelector('.arr.'+(dx<0?'r':'l'));if(b)b.click()}});
document.addEventListener('change',async e=>{
  if(e.target.id==='f'){const fs=[...e.target.files].slice(0,8-draft.length);for(const f of fs)draft.push(await shrink(f));if(draft.length>1&&!NTc)NT='Study Slides';newView('new')}
  if(e.target.id==='pf'){EPh=await sq(e.target.files[0]);const n=$('#e-name').value,b=$('#e-bio').value;editView('edit');$('#e-name').value=n;$('#e-bio').value=b}});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;$('#res').innerHTML=res()}if(e.target.id==='cap'){CAP=e.target.value;$('#capn').textContent=CAP.length}});
document.addEventListener('focusout',()=>{if(pend)setTimeout(()=>draw(),50)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id||'';if(id.startsWith('ci-'))document.querySelector(`[data-send="${id.slice(3)}"]`).click();else if(id.startsWith('a-'))document.querySelector('[data-auth]').click()});
</script></body></html>
