<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zenova Study Beta Challenge 2.0</title>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"><link rel="icon" href="logo.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"></noscript>
<style>:root{--navy:#0B2A6F;--navy-d:#071C4D;--tint:#F3F6FC;--ink:#0F1B3D;--soft:#5B6784;--line:#E1E7F2;--red:#C0392B;--green:#1B8A5A}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{letter-spacing:-.01em;color:var(--navy)}
.hidden{display:none!important}
.gate{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:100}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--navy);font-size:15px;text-decoration:none}
.logo img{width:28px;height:28px;object-fit:contain}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 60px}
.narrow{max-width:560px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:600 14.5px 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .15s}
.btn:hover:not(:disabled){background:var(--navy-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--tint)}
.btn.red{background:var(--red)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{width:100%}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--navy)}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font:14.5px 'Inter',sans-serif;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,42,111,.12)}
.field{margin-bottom:14px}
.alert{display:none;padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.5;margin-bottom:14px}
.alert.show{display:block}
.alert.err{background:#FDECEA;color:#9B2C20;border:1px solid #F4C6BF}
.alert.ok{background:#E8F6EF;color:#14683F;border:1px solid #BFE5D2}
.muted{color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--tint);color:var(--navy);border:1px solid var(--line);padding:6px 13px;border-radius:100px;font-size:13px;font-weight:600}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:28px;text-align:center}
.hero .big{font-size:clamp(36px,9vw,48px);font-weight:700;line-height:1}
.hero .big span{font-size:.45em;opacity:.7;font-weight:600}
.hero p{opacity:.8;margin-top:8px;font-size:14px}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row b{color:var(--navy)}
.good{color:var(--green)}.mid{color:#B7791F}.low{color:var(--red)}

body{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--tint)}
.auth{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px;font-weight:700;color:var(--navy);font-size:17px}
.brand img{width:38px;height:38px;object-fit:contain}
.tabs{display:flex;background:var(--tint);border-radius:10px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:600 14px 'Inter',sans-serif;color:var(--soft);cursor:pointer}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(11,42,111,.14)}
.link{background:none;border:0;color:var(--navy);font:600 13px 'Inter',sans-serif;cursor:pointer;text-decoration:underline}
.or{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:12px;margin:16px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.foot{text-align:center;margin-top:16px;font-size:12.5px}
.foot a{color:var(--soft)}
</style></head><body>
<div class="auth">
  <div class="brand"><img src="logo.png" alt="">ZENOVA STUDY</div>
  <p style="text-align:center;color:var(--soft);font-size:13.5px;font-weight:600;margin:-8px 0 18px">Beta Challenge 2.0</p>
  <p style="text-align:center;font-size:13px;margin:-8px 0 18px;color:var(--navy)"><span class="chip">Registration is open &middot; Exam day: Sat, 12 Dec 2026</span></p>
  <div class="card">
    <div class="tabs"><button id="tabLogin" class="on" type="button">Log in</button><button id="tabSignup" type="button">Sign up</button></div>
    <div class="alert err" id="err"></div><div class="alert ok" id="ok"></div>
    <form id="form" novalidate>
      <div class="field signup hidden"><label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Your full name"></div>
      <div class="field signup hidden"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" placeholder="080..."></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@email.com"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
      <button class="btn block" id="submit" type="submit">Log in</button>
    </form>
    <div class="or">or</div>
    <button class="btn ghost block" id="google" type="button">Continue with Google</button>
    <div class="foot" id="forgotWrap"><button class="link" id="forgot" type="button">Forgot password?</button></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
    apiKey: "AIzaSyA4dDvnadXfwEH4LYOqh4eG1E8CTV0ZNE0",
    authDomain: "study-hub-2b7cf.firebaseapp.com",
    projectId: "study-hub-2b7cf",
    storageBucket: "study-hub-2b7cf.firebasestorage.app",
    messagingSenderId: "168027609491",
    appId: "1:168027609491:web:56d682d82dd438f8803066"
  };
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);
const NEXT="dashboard.html";
let mode="login", busy=false;

onAuthStateChanged(auth,u=>{ if(u && !busy) location.href=NEXT; });

function setMode(m){
  mode=m;
  $('tabLogin').classList.toggle('on',m==='login');
  $('tabSignup').classList.toggle('on',m==='signup');
  document.querySelectorAll('.signup').forEach(e=>e.classList.toggle('hidden',m!=='signup'));
  $('submit').textContent = m==='login' ? 'Log in' : 'Create account';
  $('password').autocomplete = m==='login' ? 'current-password' : 'new-password';
  $('forgotWrap').classList.toggle('hidden',m!=='login');
  clear();
}
function clear(){ $('err').classList.remove('show'); $('ok').classList.remove('show'); }
function showErr(t){ $('ok').classList.remove('show'); $('err').textContent=t; $('err').classList.add('show'); }
function showOk(t){ $('err').classList.remove('show'); $('ok').textContent=t; $('ok').classList.add('show'); }
$('tabLogin').onclick=()=>setMode('login');
$('tabSignup').onclick=()=>setMode('signup');

function friendly(code){
  return ({
    'auth/invalid-email':'Enter a valid email address.',
    'auth/email-already-in-use':'That email is already registered. Try logging in.',
    'auth/weak-password':'Password should be at least 6 characters.',
    'auth/user-not-found':'No account found with that email.',
    'auth/wrong-password':'Incorrect email or password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/too-many-requests':'Too many attempts. Wait a bit and try again.',
    'auth/popup-closed-by-user':'Google sign-in was closed before finishing.',
    'auth/network-request-failed':'Network error. Check your connection.'
  })[code] || 'Something went wrong. Try again.';
}

async function saveProfile(user,extra={}){
  const ref=doc(db,"users",user.uid);
  const snap=await getDoc(ref);
  const data={uid:user.uid,email:user.email,name:extra.name||user.displayName||"",updatedAt:serverTimestamp()};
  if(extra.phone) data.phone=extra.phone;
  if(!snap.exists()){ data.createdAt=serverTimestamp(); data.phone=data.phone||""; }
  await setDoc(ref,data,{merge:true});
}

$('form').addEventListener('submit',async e=>{
  e.preventDefault(); clear();
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password) return showErr('Enter your email and password.');
  const btn=$('submit'); btn.disabled=true; busy=true;
  try{
    if(mode==='signup'){
      const name=$('name').value.trim(), phone=$('phone').value.trim();
      if(!name||!phone){ btn.disabled=false; busy=false; return showErr('Fill in every field.'); }
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      await updateProfile(cred.user,{displayName:name});
      await saveProfile(cred.user,{name,phone});
    }else{
      await signInWithEmailAndPassword(auth,email,password);
    }
    location.href=NEXT;
  }catch(err){
    console.error(err); showErr(friendly(err.code)); btn.disabled=false; busy=false;
  }
});

$('google').onclick=async()=>{
  clear(); busy=true;
  try{
    const r=await signInWithPopup(auth,new GoogleAuthProvider());
    await saveProfile(r.user,{name:r.user.displayName});
    location.href=NEXT;
  }catch(err){ console.error(err); showErr(friendly(err.code)); busy=false; }
};

$('forgot').onclick=async()=>{
  clear();
  const email=$('email').value.trim();
  if(!email) return showErr('Type your email above first, then tap "Forgot password?".');
  try{ await sendPasswordResetEmail(auth,email); showOk('Reset link sent. Check your inbox.'); }
  catch(err){ showErr(friendly(err.code)); }
};
</script></body></html>
